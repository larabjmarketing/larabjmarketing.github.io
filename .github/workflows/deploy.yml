# Compila la web (carpeta docs/) y la publica en GitHub Pages.
# Configuración en GitHub:
#   Settings > Pages > Build and deployment > Source: "GitHub Actions"
#   Settings > Secrets and variables > Actions > Variables:
#     SITE_URL (p. ej. https://www.tudominio.es), PUBLIC_GTM_ID, PUBLIC_SUPABASE_URL
#   Settings > Secrets and variables > Actions > Secrets:
#     PUBLIC_SUPABASE_ANON_KEY
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: docs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
